<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Pronunciation - 영어 노래 발음 연습</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <h1>Song Pronunciation</h1>
        <p class="header-sub">영어 노래로 쉽게 발음 배우기</p>
    </header>

    <main class="main">
        <form id="searchForm" class="search-form">
            <input
                type="text"
                id="artistInput"
                class="input"
                placeholder="아티스트 (선택)"
                autocomplete="off"
            >
            <input
                type="text"
                id="titleInput"
                class="input"
                placeholder="노래 제목 (선택)"
                autocomplete="off"
            >
            <button type="submit" class="btn-search">검색</button>
        </form>

        <div id="status" class="status hidden"></div>

        <section id="results" class="results hidden">
            <div class="song-info">
                <h2 id="songTitle" class="song-title"></h2>
                <p id="songArtist" class="song-artist"></p>
            </div>
            <div id="lyricsContainer" class="lyrics"></div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
