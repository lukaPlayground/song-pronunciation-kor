<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Pronunciation - 영어 노래 발음 연습</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <h1>Song Pronunciation</h1>
        <p class="header-sub">영어 노래로 쉽게 발음 배우기</p>
    </header>

    <main class="main">
        <form id="searchForm" class="search-form">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="searchInput"
                    class="input"
                    placeholder="아티스트 또는 노래 제목"
                    autocomplete="off"
                >
                <ul id="searchAutocomplete" class="autocomplete-list hidden"></ul>
            </div>
            <button type="submit" class="btn-search">검색</button>
        </form>

        <!-- 국가별 차트 -->
        <section id="chartSection" class="chart-section">
            <div class="chart-header">
                <span class="chart-title">지금 인기 차트</span>
                <div class="chart-tabs" id="chartTabs">
                    <button class="chart-tab active" data-country="kr">한국</button>
                    <button class="chart-tab" data-country="us">US</button>
                    <button class="chart-tab" data-country="gb">UK</button>
                    <button class="chart-tab" data-country="jp">일본</button>
                    <button class="chart-tab" data-country="au">AU</button>
                </div>
            </div>
            <div id="chartStatus" class="chart-loading">불러오는 중...</div>
            <ol id="chartList" class="chart-list hidden"></ol>
        </section>

        <section id="candidatePanel" class="candidate-panel hidden">
            <h3 class="candidate-heading">검색 결과를 선택해주세요</h3>
            <ul id="candidateList" class="candidate-list"></ul>
        </section>

        <div id="status" class="status hidden"></div>

        <section id="results" class="results hidden">
            <div class="song-info">
                <h2 id="songTitle" class="song-title"></h2>
                <p id="songArtist" class="song-artist"></p>
            </div>
            <div id="lyricsContainer" class="lyrics"></div>
        </section>
    </main>

    <script src="/static/js/autocomplete.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
